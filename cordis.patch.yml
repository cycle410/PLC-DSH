- insert:
    - id: agentplc
      name: '@local/dsh-agentplc'
      config:
        # Directories scanned for OMRON .smc2 and TIA Portal .ap* projects.
        # No defaults: the list starts empty and is managed from the panel
        # (add a folder by path or with the native "Browse…" dialog, remove with the root list).
        projectRoots: []
        # Deep enough for real project trees such as <plant>/<line>/<station>/<project>.
        scanDepth: 8
        scanLimit: 2000
        # Used when a TIA project is created without an .ap<version> suffix.
        tiaDefaultVersion: V16
